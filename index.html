<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجتمع آموزشی دخترانه معرفت | پنل اولیا</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; }
    .card-summary { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .logo-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #dc3545; }
  </style>
</head>
<body>

  <div class="bg-white border-bottom p-3 mb-4 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="public/logo.jpg" class="logo-img" alt="معرفت">
        <div>
          <h5 class="m-0 fw-bold text-danger">مجتمع آموزشی دخترانه معرفت</h5>
          <small class="text-muted">سامانه هوشمند شهریه و اقساط</small>
        </div>
      </div>
      <span class="badge bg-danger p-2">۱۴۰۶-۱۴۰۵</span>
    </div>
  </div>

  <div class="container">
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card card-summary bg-white p-3 text-center">
          <span class="text-muted small">شهریه خالص (پس از تخفیف)</span>
          <h4 class="fw-bold mt-2">۲۴,۰۰۰,۰۰۰ تومان</h4>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card card-summary bg-white p-3 text-center">
          <span class="text-muted small">پرداخت‌شده</span>
          <h4 class="text-success fw-bold mt-2">۱۵,۰۰۰,۰۰۰ تومان</h4>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card card-summary bg-white p-3 text-center">
          <span class="text-muted small">مانده بدهی</span>
          <h4 class="text-danger fw-bold mt-2">۹,۰۰۰,۰۰۰ تومان</h4>
        </div>
      </div>
    </div>

    <h6 class="fw-bold mb-3">📋 اقساط شهریه</h6>
    <div class="card card-summary p-3 mb-3 border-start border-danger border-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h6 class="mb-1 fw-bold">قسط دوم - آبان‌ماه</h6>
          <span class="text-muted small">سررسید: ۱۴۰۵/۰۸/۱۵</span>
        </div>
        <div class="text-end">
          <span class="badge bg-warning text-dark">سررسید شده</span>
          <div class="fw-bold mt-1">۴,۰۰۰,۰۰۰ تومان</div>
        </div>
      </div>
      <button class="btn btn-danger w-100 py-2 fw-bold" onclick="alert('انتقال به درگاه پرداخت آنلاین...')">💳 پرداخت آنلاین سریع</button>
    </div>
  </div>

</body>
</html>
