<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت مالی | مجتمع دخترانه معرفت</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <img src="public/logo.jpg" style="width:50px; height:50px; border-radius:50%;">
      <h4 class="fw-bold text-danger m-0">پنل حسابداری - مجتمع آموزشی دخترانه معرفت</h4>
    </div>

    <div class="card p-4 border-0 shadow-sm mb-4">
      <h5 class="fw-bold mb-3">➕ ثبت دریافت حضوری (نقدی / پوز / چک)</h5>
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="نام دانش‌آموز">
        </div>
        <div class="col-md-3">
          <select class="form-select">
            <option>💵 پرداخت نقدی</option>
            <option>💳 کارتخوان (پوز)</option>
            <option>📜 چک صیادی</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" placeholder="مبلغ (تومان)">
        </div>
        <div class="col-md-2">
          <button class="btn btn-success w-100 fw-bold" onclick="alert('پرداخت ثبت و رسید چاپ شد.')">ثبت و صدور رسید</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
